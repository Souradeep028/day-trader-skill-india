    r.onclick = () => { state.sel = t.id; render(); };
    list.appendChild(r);
  }
  const cur = list.querySelector('[aria-selected="true"]'); if (cur) cur.scrollIntoView({ block: "nearest" });
  detail(DATA.trades.find(t => t.id === state.sel));
}

let chart = null;
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function detail(t) {
  const box = document.getElementById("detail"); box.innerHTML = "";
  if (chart) { chart.remove(); chart = null; }
  if (!t) { box.appendChild(el("div", { class: "panel empty" }, "<strong>Pick a trade.</strong>Its chart, prices and costs show here.")); return; }
  const meta = KINDS[t.kind];
  const head = el("div", { class: "panel" });
  head.innerHTML = `<div class="dhead"><h2>${t.symbol.replace(".NS", "")} <span class="chip solid">${meta.name}</span></h2>
    <span class="num ${cls(t.net)}" style="font-size:1.1rem">${rtxt(t.R)} · ${rupee(t.net, true)}</span></div>
    <div class="meta" style="color:var(--muted)">${longDate(t.date)} ${t.date.slice(0, 4)} · ${t.side} ${t.qty} shares${meta.replay ? " · before the freeze: not part of the test" : ""}</div>
    <div id="chart" role="img" aria-label="5-minute chart of ${t.symbol} with the trade's entry, stop and exit"></div>
    <div class="legend"><span><i style="border-color:var(--accent)"></i>entry</span><span><i style="border-color:var(--loss);border-top-style:dashed"></i>stop</span>${t.target ? '<span><i style="border-color:var(--win);border-top-style:dashed"></i>target</span>' : ""}<span><i style="border-color:var(--amber)"></i>exit</span></div>`;
  box.appendChild(head);
  const facts = [["Entry", `${t.entry_label} · ${px(t.entry)}`], ["Stop", px(t.stop)]];
  if (t.target) facts.push(["Target", px(t.target)]);
  facts.push(["Exit", `${t.exit_label} · ${px(t.exit)}`], ["Ended", t.exit_reason || (t.outcome === "stop" ? "at the stop" : t.outcome === "target" ? "at the target" : "at the 15:10 flat-by")],
    ["Shares", String(t.qty)], ["Risk a share", px(Math.abs(t.entry - t.stop))]);
  if (t.gap_pct != null) facts.push(["Gap at the open", (t.gap_pct > 0 ? "+" : "") + t.gap_pct.toFixed(2) + " %"]);
  if (t.signal != null) facts.push(["Signal price", px(t.signal)], ["Entry slippage", (t.slippage >= 0 ? "+" : "") + px(t.slippage) + " a share"]);
  const c = t.costs, lines = [["Gross", t.gross], ["Brokerage", -c.brokerage], ["STT", -c.stt], ["Exchange", -c.exchange],
    ["SEBI", -c.sebi], ["Stamp duty", -c.stamp], ["GST", -c.gst]];
  const g = el("div", { class: "grid2" });
  g.innerHTML = `<div class="panel"><div class="label" style="margin-bottom:8px">The trade</div><dl class="facts">${facts.map(([k, v]) => `<div><dt class="label">${k}</dt><dd>${v}</dd></div>`).join("")}</dl></div>
    <div class="panel"><div class="label" style="margin-bottom:6px">Costs</div><table class="costs"><tbody>
    ${lines.map(([k, v]) => `<tr><td>${k}</td><td class="${k === "Gross" ? cls(v) : ""}">${k === "Gross" ? rupee(v, true) : (v === 0 ? "₹0.00" : "−₹" + Math.abs(v).toFixed(2))}</td></tr>`).join("")}
    <tr class="total"><td>Net</td><td class="${cls(t.net)}">${rupee(t.net, true)}</td></tr></tbody></table>
    <p class="note">The prices already include ${t.signal != null ? "the autopilot's real fill and " : ""}one tick of slippage each way (about ₹${t.tick_cost.toFixed(0)} on ${t.qty} shares).</p></div>`;
  box.appendChild(g);
  drawChart(t);
}

function drawChart(t) {
  const node = document.getElementById("chart");
  if (!window.LightweightCharts || !t.bars.length) { node.innerHTML = '<p class="note">The chart library did not load, so only the numbers show.</p>'; return; }
  chart = LightweightCharts.createChart(node, { autoSize: true,
    layout: { background: { type: "solid", color: css("--surface") }, textColor: css("--muted"), fontFamily: "IBM Plex Mono, monospace", fontSize: 11 },
    grid: { vertLines: { color: css("--line") }, horzLines: { color: css("--line") } },
    rightPriceScale: { borderColor: css("--line") }, timeScale: { borderColor: css("--line"), timeVisible: true, secondsVisible: false },
    crosshair: { mode: 0 } });
  const s = chart.addCandlestickSeries({ upColor: css("--win"), downColor: css("--loss"), borderVisible: false,
    wickUpColor: css("--win"), wickDownColor: css("--loss") });
  s.setData(t.bars.map(b => ({ time: b[0], open: b[1], high: b[2], low: b[3], close: b[4] })));
  const line = (price, color, style, title) => price != null && s.createPriceLine({ price, color, lineWidth: 1, lineStyle: style, axisLabelVisible: true, title });
  line(t.entry, css("--accent"), 0, "entry"); line(t.stop, css("--loss"), 2, "stop");
  line(t.target, css("--win"), 2, "target"); line(t.exit, css("--amber"), 0, "exit");
  const short = t.side === "short", m = [];
  if (t.entry_time) m.push({ time: t.entry_time, position: short ? "aboveBar" : "belowBar", color: css("--accent"), shape: short ? "arrowDown" : "arrowUp", text: (short ? "sell " : "buy ") + px(t.entry) });
  if (t.exit_time) m.push({ time: t.exit_time, position: short ? "belowBar" : "aboveBar", color: css("--amber"), shape: "circle", text: "exit " + px(t.exit) });
  m.sort((a, b) => a.time - b.time); s.setMarkers(m);
  chart.timeScale().fitContent();
}

function boot() {
  if (!DATA) { document.getElementById("list").innerHTML = '<div class="empty"><strong>No data in this page.</strong>Build it with ops/audit/build.py.</div>'; return; }
  try { state.kind = localStorage.getItem("audit-kind") || state.kind; state.out = localStorage.getItem("audit-out") || state.out; } catch (e) {}
  const run = DATA.trades.some(t => !KINDS[t.kind].replay);
  if (!run && state.kind === "run") state.kind = "replay";
  document.getElementById("built").textContent = "Built " + DATA.built + ".";
  document.getElementById("lede").textContent = `Every trade of the two-week paper run, on its own 5-minute chart, with the cost of each one. ORB: ${DATA.orb_rule}, frozen ${longDate(DATA.orb_started)}. Gap-up: ${DATA.gap_rule}, frozen ${DATA.gap_started ? longDate(DATA.gap_started) : "–"}. Paper and shadow only: nothing here was placed.`;
  tiles();
  seg("f-kind", [["run", "The run"], ["orb-shadow", "ORB shadow"], ["orb-paper", "ORB paper"], ["gap-shadow", "Gap shadow"], ["replay", "Replay before the freeze"]], "kind");
  seg("f-out", [["all", "All"], ["win", "Won"], ["loss", "Lost"]], "out");
  render();
  document.getElementById("list").addEventListener("keydown", e => {
    if (!["ArrowDown", "ArrowUp"].includes(e.key)) return;
    e.preventDefault(); const rows = visible(), i = rows.findIndex(t => t.id === state.sel);
    const j = Math.max(0, Math.min(rows.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
    state.sel = rows[j].id; render(); });
  const redraw = () => { const t = DATA.trades.find(x => x.id === state.sel); if (t) detail(t); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
  new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
}
boot();
</script>
