<title>Paper Run Audit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: a trading-desk ledger. Summary strip, then a two-pane audit: trade list | chart, details and costs. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --raised: #eef2f6; --ink: #15202b; --muted: #586474; --line: #d9dfe6;
  --accent: #2c5a85; --accent-ink: #ffffff; --win: #1b7f47; --loss: #be3a30; --amber: #9a6410;
  --sel: #e3ecf5;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1319; --surface: #151c24; --raised: #1b242e; --ink: #e4e9ef; --muted: #93a0af; --line: #27313c;
  --accent: #7ea6cf; --accent-ink: #0e1319; --win: #49c07c; --loss: #ef6b5f; --amber: #e0a84f; --sel: #1f2c3a;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #151c24; --raised: #1b242e; --ink: #e4e9ef; --muted: #93a0af; --line: #27313c;
  --accent: #7ea6cf; --accent-ink: #0e1319; --win: #49c07c; --loss: #ef6b5f; --amber: #e0a84f; --sel: #1f2c3a;
  color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 1.75rem; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 4px 0 0; max-width: 72ch; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.pos { color: var(--win); } .neg { color: var(--loss); }

/* summary strip */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
.tile .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tile .name { font-weight: 600; }
.tile .since { font-size: .75rem; color: var(--muted); }
.tile .row { display: flex; gap: 14px; flex-wrap: wrap; }
.tile .big { font-family: var(--f-data); font-size: 1.15rem; }
.tile.replay { background: transparent; border-style: dashed; }

/* filters */
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: .85rem; border: 0; background: transparent; color: var(--ink); padding: 6px 11px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible, .trade:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* two panes */
.panes { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 820px) { .panes { grid-template-columns: minmax(0, 1fr); } .list { max-height: 300px; } }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; max-height: 720px; overflow-y: auto; }
.trade { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.trade:last-child { border-bottom: 0; }
.trade[aria-selected="true"] { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
.trade .sym { font-weight: 600; }
.trade .meta { font-size: .78rem; color: var(--muted); }
.trade .r { text-align: right; font-family: var(--f-data); }
.chip { display: inline-block; font-size: .7rem; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.chip.solid { background: var(--raised); }
.detail { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.dhead { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; }
.dhead h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.35rem; margin: 0; }
#chart { height: 360px; margin-top: 10px; }
@media (max-width: 520px) { #chart { height: 280px; } }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 700px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
dl.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px 14px; margin: 0; }
dl.facts div { display: grid; gap: 1px; }
dl.facts dd { margin: 0; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
table.costs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.costs td { padding: 4px 0; border-bottom: 1px dashed var(--line); }
table.costs td:last-child { text-align: right; font-family: var(--f-data); }
table.costs tr.total td { border-bottom: 0; border-top: 1px solid var(--ink); font-weight: 600; padding-top: 7px; }
.note { font-size: .8rem; color: var(--muted); margin: 8px 0 0; }
.empty { padding: 26px 16px; color: var(--muted); text-align: left; }
.empty strong { color: var(--ink); display: block; margin-bottom: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .78rem; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
footer { font-size: .78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; }
footer a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>Paper Run Audit</h1>
    <p class="lede" id="lede">Every trade of the two-week paper run, on its own 5-minute chart, with the cost of each one. Paper and shadow only: nothing here was placed.</p>
  </header>

  <section class="strip" id="strip" aria-label="Totals by test"></section>

  <div class="bar" role="toolbar" aria-label="Filters">
    <div class="seg" id="f-kind" aria-label="Test"></div>
    <div class="seg" id="f-out" aria-label="Outcome"></div>
  </div>

  <div class="panes">
    <div class="list" id="list" role="listbox" aria-label="Trades" tabindex="0"></div>
    <div class="detail" id="detail"></div>
  </div>

  <footer>
    <span id="built"></span>
    <span>Prices are Yahoo's 5-minute bars, India time. Charges are Zerodha's intraday rates.</span>
    <span>Charts: <a href="https://www.tradingview.com/lightweight-charts/" target="_blank" rel="noopener">TradingView Lightweight Charts</a></span>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const DATA = /*AUDIT_DATA*/null;
const KINDS = {
  "orb-shadow": { name: "ORB short, shadow", short: "ORB shadow" },
  "orb-paper": { name: "ORB short, paper", short: "ORB paper" },
  "gap-shadow": { name: "Gap-up short, shadow", short: "Gap shadow" },
  "replay-orb": { name: "ORB short, replay", short: "ORB replay", replay: true },
  "replay-gap": { name: "Gap-up short, replay", short: "Gap replay", replay: true },
};
const state = { kind: "run", out: "all", sel: null };
const rupee = (x, sign) => { const s = Math.abs(x).toLocaleString("en-IN", { maximumFractionDigits: 0 });
  return (x < 0 ? "−" : sign && x > 0 ? "+" : "") + "₹" + s; };
const px = x => x == null ? "–" : Number(x).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const rtxt = r => r == null ? "–" : (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r).toFixed(2) + " R";
const cls = x => x > 0 ? "pos" : x < 0 ? "neg" : "";
const longDate = d => new Date(d + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short", weekday: "short" });
const el = (tag, attrs = {}, html = "") => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); e.innerHTML = html; return e; };

function tiles() {
  const s = DATA.summary, strip = document.getElementById("strip"); strip.innerHTML = "";
  for (const [k, meta] of Object.entries(KINDS)) {
    const v = s[k] || { trades: 0, wins: 0, avg_R: null, net: 0, profit_factor: null };
    const since = meta.replay ? "before the freeze, from " + (DATA.replay_from ? longDate(DATA.replay_from) : "–")
      : "since " + longDate(k.startsWith("gap") ? DATA.gap_started : DATA.orb_started);
    const t = el("div", { class: "tile" + (meta.replay ? " replay" : "") });
    t.innerHTML = `<div class="head"><span class="name">${meta.name}</span><span class="since">${since}</span></div>
      <div class="row"><span class="big num ${cls(v.avg_R)}">${v.trades ? rtxt(v.avg_R) : "no trades yet"}</span></div>
      <div class="row"><span><span class="label">Trades</span> <span class="num">${v.trades}</span></span>
      <span><span class="label">Won</span> <span class="num">${v.wins}</span></span>
      <span><span class="label">Net</span> <span class="num ${cls(v.net)}">${v.trades ? rupee(v.net, true) : "–"}</span></span>
      <span><span class="label">PF</span> <span class="num">${v.profit_factor == null ? "–" : v.profit_factor.toFixed(2)}</span></span></div>`;
    strip.appendChild(t);
  }
}

function seg(id, opts, key) {
  const box = document.getElementById(id); box.innerHTML = "";
  for (const [v, label] of opts) {
    const b = el("button", { type: "button", id: id + "-" + v, "aria-pressed": String(state[key] === v) }, label);
    b.onclick = () => { state[key] = v; state.sel = null; try { localStorage.setItem("audit-" + key, v); } catch (e) {}
      seg(id, opts, key); render(); };
    box.appendChild(b);
  }
}

function visible() {
  return DATA.trades.filter(t => {
    const replay = KINDS[t.kind].replay;
    if (state.kind === "run" && replay) return false;
    if (state.kind === "replay" && !replay) return false;
    if (!["run", "replay"].includes(state.kind) && t.kind !== state.kind) return false;
    if (state.out === "win" && !(t.net > 0)) return false;
    if (state.out === "loss" && !(t.net <= 0)) return false;
    return true;
  });
}

function render() {
  const list = document.getElementById("list"), rows = visible(); list.innerHTML = "";
  if (!rows.length) {
    const run = state.kind !== "replay";
    list.appendChild(el("div", { class: "empty" }, run
      ? `<strong>No trades here yet.</strong>The run's trades appear after each day's close, from ${longDate(DATA.orb_started > DATA.today ? DATA.orb_started : DATA.today)}. Until then, the replay shows both rules on the sessions before they were frozen.`
      : "<strong>No replay trades match.</strong>Try another filter."));
    detail(null); return;
  }
  if (state.sel == null || !rows.find(t => t.id === state.sel)) state.sel = rows[0].id;
  for (const t of rows) {
    const r = el("div", { class: "trade", role: "option", "aria-selected": String(t.id === state.sel), "data-id": t.id });
    r.innerHTML = `<div><span class="sym">${t.symbol.replace(".NS", "")}</span><span class="chip">${KINDS[t.kind].short}</span>
      <div class="meta">${longDate(t.date)} · ${t.side} · ${t.outcome === "stop" ? "stopped" : t.outcome === "target" ? "target" : "out at the flat-by"}</div></div>
      <div class="r"><div class="${cls(t.R)}">${rtxt(t.R)}</div><div class="meta ${cls(t.net)}">${rupee(t.net, true)}</div></div>`;
    r.onclick = () => { state.sel = t.id; render(); };
    list.appendChild(r);
  }
  const cur = list.querySelector('[aria-selected="true"]'); if (cur) cur.scrollIntoView({ block: "nearest" });
  detail(DATA.trades.find(t => t.id === state.sel));
}

let chart = null;
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function detail(t) {
  const box = document.getElementById("detail"); box.innerHTML = "";
  if (chart) { chart.remove(); chart = null; }
  if (!t) { box.appendChild(el("div", { class: "panel empty" }, "<strong>Pick a trade.</strong>Its chart, prices and costs show here.")); return; }
  const meta = KINDS[t.kind];
  const head = el("div", { class: "panel" });
  head.innerHTML = `<div class="dhead"><h2>${t.symbol.replace(".NS", "")} <span class="chip solid">${meta.name}</span></h2>
    <span class="num ${cls(t.net)}" style="font-size:1.1rem">${rtxt(t.R)} · ${rupee(t.net, true)}</span></div>
    <div class="meta" style="color:var(--muted)">${longDate(t.date)} ${t.date.slice(0, 4)} · ${t.side} ${t.qty} shares${meta.replay ? " · before the freeze: not part of the test" : ""}</div>
    <div id="chart" role="img" aria-label="5-minute chart of ${t.symbol} with the trade's entry, stop and exit"></div>
    <div class="legend"><span><i style="border-color:var(--accent)"></i>entry</span><span><i style="border-color:var(--loss);border-top-style:dashed"></i>stop</span>${t.target ? '<span><i style="border-color:var(--win);border-top-style:dashed"></i>target</span>' : ""}<span><i style="border-color:var(--amber)"></i>exit</span></div>`;
  box.appendChild(head);
  const facts = [["Entry", `${t.entry_label} · ${px(t.entry)}`], ["Stop", px(t.stop)]];
  if (t.target) facts.push(["Target", px(t.target)]);
  facts.push(["Exit", `${t.exit_label} · ${px(t.exit)}`], ["Ended", t.exit_reason || (t.outcome === "stop" ? "at the stop" : t.outcome === "target" ? "at the target" : "at the 15:10 flat-by")],
    ["Shares", String(t.qty)], ["Risk a share", px(Math.abs(t.entry - t.stop))]);
  if (t.gap_pct != null) facts.push(["Gap at the open", (t.gap_pct > 0 ? "+" : "") + t.gap_pct.toFixed(2) + " %"]);
  if (t.signal != null) facts.push(["Signal price", px(t.signal)], ["Entry slippage", (t.slippage >= 0 ? "+" : "") + px(t.slippage) + " a share"]);
  const c = t.costs, lines = [["Gross", t.gross], ["Brokerage", -c.brokerage], ["STT", -c.stt], ["Exchange", -c.exchange],
    ["SEBI", -c.sebi], ["Stamp duty", -c.stamp], ["GST", -c.gst]];
  const g = el("div", { class: "grid2" });
  g.innerHTML = `<div class="panel"><div class="label" style="margin-bottom:8px">The trade</div><dl class="facts">${facts.map(([k, v]) => `<div><dt class="label">${k}</dt><dd>${v}</dd></div>`).join("")}</dl></div>
    <div class="panel"><div class="label" style="margin-bottom:6px">Costs</div><table class="costs"><tbody>
    ${lines.map(([k, v]) => `<tr><td>${k}</td><td class="${k === "Gross" ? cls(v) : ""}">${k === "Gross" ? rupee(v, true) : (v === 0 ? "₹0.00" : "−₹" + Math.abs(v).toFixed(2))}</td></tr>`).join("")}
    <tr class="total"><td>Net</td><td class="${cls(t.net)}">${rupee(t.net, true)}</td></tr></tbody></table>
    <p class="note">The prices already include ${t.signal != null ? "the autopilot's real fill and " : ""}one tick of slippage each way (about ₹${t.tick_cost.toFixed(0)} on ${t.qty} shares).</p></div>`;
  box.appendChild(g);
  drawChart(t);
}

function drawChart(t) {
  const node = document.getElementById("chart");
  if (!window.LightweightCharts || !t.bars.length) { node.innerHTML = '<p class="note">The chart library did not load, so only the numbers show.</p>'; return; }
  chart = LightweightCharts.createChart(node, { autoSize: true,
    layout: { background: { type: "solid", color: css("--surface") }, textColor: css("--muted"), fontFamily: "IBM Plex Mono, monospace", fontSize: 11 },
    grid: { vertLines: { color: css("--line") }, horzLines: { color: css("--line") } },
    rightPriceScale: { borderColor: css("--line") }, timeScale: { borderColor: css("--line"), timeVisible: true, secondsVisible: false },
    crosshair: { mode: 0 } });
  const s = chart.addCandlestickSeries({ upColor: css("--win"), downColor: css("--loss"), borderVisible: false,
    wickUpColor: css("--win"), wickDownColor: css("--loss") });
  s.setData(t.bars.map(b => ({ time: b[0], open: b[1], high: b[2], low: b[3], close: b[4] })));
  const line = (price, color, style, title) => price != null && s.createPriceLine({ price, color, lineWidth: 1, lineStyle: style, axisLabelVisible: true, title });
  line(t.entry, css("--accent"), 0, "entry"); line(t.stop, css("--loss"), 2, "stop");
  line(t.target, css("--win"), 2, "target"); line(t.exit, css("--amber"), 0, "exit");
  const short = t.side === "short", m = [];
  if (t.entry_time) m.push({ time: t.entry_time, position: short ? "aboveBar" : "belowBar", color: css("--accent"), shape: short ? "arrowDown" : "arrowUp", text: (short ? "sell " : "buy ") + px(t.entry) });
  if (t.exit_time) m.push({ time: t.exit_time, position: short ? "belowBar" : "aboveBar", color: css("--amber"), shape: "circle", text: "exit " + px(t.exit) });
  m.sort((a, b) => a.time - b.time); s.setMarkers(m);
  chart.timeScale().fitContent();
}

function boot() {
  if (!DATA) { document.getElementById("list").innerHTML = '<div class="empty"><strong>No data in this page.</strong>Build it with trader-broker/audit.py.</div>'; return; }
  try { state.kind = localStorage.getItem("audit-kind") || state.kind; state.out = localStorage.getItem("audit-out") || state.out; } catch (e) {}
  const run = DATA.trades.some(t => !KINDS[t.kind].replay);
  if (!run && state.kind === "run") state.kind = "replay";
  document.getElementById("built").textContent = "Built " + DATA.built + ".";
  document.getElementById("lede").textContent = `Every trade of the two-week paper run, on its own 5-minute chart, with the cost of each one. ORB: ${DATA.orb_rule}, frozen ${longDate(DATA.orb_started)}. Gap-up: ${DATA.gap_rule}, frozen ${DATA.gap_started ? longDate(DATA.gap_started) : "–"}. Paper and shadow only: nothing here was placed.`;
  tiles();
  seg("f-kind", [["run", "The run"], ["orb-shadow", "ORB shadow"], ["orb-paper", "ORB paper"], ["gap-shadow", "Gap shadow"], ["replay", "Replay before the freeze"]], "kind");
  seg("f-out", [["all", "All"], ["win", "Won"], ["loss", "Lost"]], "out");
  render();
  document.getElementById("list").addEventListener("keydown", e => {
    if (!["ArrowDown", "ArrowUp"].includes(e.key)) return;
    e.preventDefault(); const rows = visible(), i = rows.findIndex(t => t.id === state.sel);
    const j = Math.max(0, Math.min(rows.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
    state.sel = rows[j].id; render(); });
  const redraw = () => { const t = DATA.trades.find(x => x.id === state.sel); if (t) detail(t); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
  new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
}
boot();
</script>
